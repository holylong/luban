<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breaker — 霓虹打砖块</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { background: #0b0e1a; border-radius: 8px; box-shadow: 0 0 50px rgba(112,161,255,.25); max-width: 98vw; max-height: 98vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
(() => {
'use strict';
const W = 800, H = 600;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

// ---------- audio (WebAudio, no external files) ----------
let AC = null;
function beep(freq, dur, type, vol, slide) {
  type = type || 'square'; vol = vol == null ? 0.07 : vol;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

// ---------- helpers ----------
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- state ----------
const MENU = 0, PLAY = 1, OVER = 2;
let state = MENU;
let score = 0, best = 0, lives = 3, level = 1, combo = 0, shake = 0;
let baseSpeed = 340;
let keys = {}, mouseX = null;
try { best = +localStorage.getItem('neon_breaker_best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('neon_breaker_best', String(best)); } catch (e) {} }

const paddle = { w: 120, h: 14, x: W / 2 - 60, y: H - 42, speed: 560 };
let balls = [], bricks = [], powerups = [], particles = [], floats = [];

const COLS = ['#ff5d73', '#ffb13d', '#f9f871', '#7bed9f', '#70a1ff', '#a29bfe', '#fd79a8', '#55efc4'];

function makeBall(stuck) {
  return { x: paddle.x + paddle.w / 2, y: paddle.y - 9, r: 8, vx: 0, vy: 0, speed: baseSpeed, stuck: !!stuck, trail: [] };
}
function launchBall(b) {
  const a = -Math.PI / 2 + (Math.random() * 0.7 - 0.35);
  b.vx = Math.cos(a) * b.speed;
  b.vy = Math.sin(a) * b.speed;
  b.stuck = false;
}
function normalize(b) {
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * b.speed; b.vy = b.vy / m * b.speed;
}

function buildLevel() {
  bricks = [];
  const rows = Math.min(8, 4 + level), cols = 10, bw = 64, bh = 22, gap = 6;
  const totalW = cols * (bw + gap) - gap;
  const ox = (W - totalW) / 2, oy = 74;
  for (let r = 0; r < rows; r++) {
    const hp = r < Math.max(0, level - 1) ? 2 : 1;
    for (let c = 0; c < cols; c++) {
      bricks.push({ x: ox + c * (bw + gap), y: oy + r * (bh + gap), w: bw, h: bh, hp, maxhp: hp, color: COLS[r % COLS.length], pts: (rows - r) * 10 });
    }
  }
}

function resetGame() {
  score = 0; lives = 3; level = 1; combo = 0; baseSpeed = 340;
  paddle.w = 120; paddle.x = W / 2 - paddle.w / 2;
  powerups = []; particles = []; floats = [];
  buildLevel();
  balls = [makeBall(true)];
  state = PLAY;
}

function nextLevel() {
  level++;
  score += 300;
  baseSpeed += 25;
  buildLevel();
  powerups = [];
  balls = [makeBall(true)];
  floats.push({ x: W / 2, y: H / 2, text: 'LEVEL ' + level + '  +300', t: 1.6, color: '#fff', big: true });
  beep(660, 0.12, 'triangle', 0.09);
  setTimeout(() => beep(880, 0.12, 'triangle', 0.09), 130);
  setTimeout(() => beep(1100, 0.2, 'triangle', 0.09), 260);
}

function loseLife() {
  lives--; combo = 0; shake = 14;
  paddle.w = 120; powerups = [];
  beep(180, 0.35, 'sawtooth', 0.1, -120);
  if (lives <= 0) {
    state = OVER;
    if (score > best) { best = score; saveBest(); }
    beep(120, 0.6, 'sawtooth', 0.1, -60);
  } else {
    balls = [makeBall(true)];
  }
}

// ---------- powerups ----------
const PU = { wide: '#70a1ff', multi: '#7bed9f', slow: '#f9f871', life: '#ff5d73' };
function maybeDropPowerup(br) {
  if (Math.random() > 0.16) return;
  const roll = Math.random();
  let k = 'wide';
  if (roll < 0.07) k = 'life';
  else if (roll < 0.4) k = 'multi';
  else if (roll < 0.7) k = 'slow';
  powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, r: 11, vy: 140, k, color: PU[k], label: k === 'life' ? '+' : k[0].toUpperCase(), spin: 0 });
}
function applyPowerup(p) {
  beep(700, 0.12, 'triangle', 0.1, 320);
  spawnParticles(p.x, p.y, p.color, 12);
  let text = '';
  if (p.k === 'wide') { paddle.w = Math.min(230, paddle.w + 45); text = 'PADDLE +'; }
  else if (p.k === 'life') { lives++; text = 'LIFE +'; }
  else if (p.k === 'slow') {
    for (const b of balls) { b.speed = Math.max(230, b.speed - 45); normalize(b); }
    text = 'SLOW';
  } else if (p.k === 'multi') {
    const src = balls.find(b => !b.stuck) || balls[0];
    if (src && balls.length < 14) {
      for (let i = 0; i < 2; i++) {
        const nb = makeBall(false);
        nb.x = src.x; nb.y = src.y; nb.speed = src.speed;
        const a = Math.random() * Math.PI * 2;
        nb.vx = Math.cos(a) * nb.speed; nb.vy = Math.sin(a) * nb.speed;
        if (nb.vy > -80) nb.vy = -Math.abs(nb.vy) - 80;
        normalize(nb);
        balls.push(nb);
      }
    }
    text = 'x3 BALLS';
  }
  floats.push({ x: p.x, y: p.y, text, t: 1, color: p.color });
}

// ---------- particles / floating text ----------
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 190;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, t: 0.4 + Math.random() * 0.4, color, r: 1.5 + Math.random() * 2.5 });
  }
}

// ---------- update ----------
function update(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.t -= dt; }
  particles = particles.filter(p => p.t > 0);
  for (const f of floats) { f.y -= 34 * dt; f.t -= dt; }
  floats = floats.filter(f => f.t > 0);
  if (state !== PLAY) return;

  // paddle: keys take priority, else follow mouse
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { paddle.x -= paddle.speed * dt; mouseX = null; }
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) { paddle.x += paddle.speed * dt; mouseX = null; }
  else if (mouseX !== null) paddle.x = mouseX - paddle.w / 2;
  paddle.x = clamp(paddle.x, 0, W - paddle.w);

  // balls
  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x + paddle.w / 2; b.y = paddle.y - b.r - 1; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();
    // walls
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(300, 0.03, 'square', 0.04); }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(300, 0.03, 'square', 0.04); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); beep(300, 0.03, 'square', 0.04); }
    // paddle bounce: angle depends on where it hits
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r < paddle.y + paddle.h &&
        b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r) {
      const rel = clamp((b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const ang = -Math.PI / 2 + rel * 1.05;
      b.vx = Math.cos(ang) * b.speed;
      b.vy = Math.sin(ang) * b.speed;
      if (Math.abs(b.vy) < b.speed * 0.3) b.vy = -b.speed * 0.3;
      normalize(b);
      b.y = paddle.y - b.r;
      combo = 0;
      beep(440, 0.05, 'square', 0.06);
    }
    // bricks (one hit per ball per frame)
    for (let i = bricks.length - 1; i >= 0; i--) {
      const br = bricks[i];
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        const oL = (b.x + b.r) - br.x, oR = (br.x + br.w) - (b.x - b.r);
        const oT = (b.y + b.r) - br.y, oB = (br.y + br.h) - (b.y - b.r);
        const m = Math.min(oL, oR, oT, oB);
        if (m === oL) { b.vx = -Math.abs(b.vx); b.x -= oL; }
        else if (m === oR) { b.vx = Math.abs(b.vx); b.x += oR; }
        else if (m === oT) { b.vy = -Math.abs(b.vy); b.y -= oT; }
        else { b.vy = Math.abs(b.vy); b.y += oB; }
        hitBrick(br, i);
        break;
      }
    }
  }
  balls = balls.filter(b => b.y - b.r < H + 30);
  if (!balls.length) loseLife();

  // powerups fall & get caught by paddle
  for (const p of powerups) {
    p.y += p.vy * dt; p.spin += dt * 4;
    if (p.y + p.r > paddle.y && p.y - p.r < paddle.y + paddle.h && p.x > paddle.x - p.r && p.x < paddle.x + paddle.w + p.r) {
      applyPowerup(p); p.dead = true;
    }
  }
  powerups = powerups.filter(p => !p.dead && p.y < H + 30);
}

function hitBrick(br, i) {
  br.hp--;
  if (br.hp <= 0) {
    combo++;
    const gain = br.pts * Math.max(1, combo);
    score += gain;
    floats.push({ x: br.x + br.w / 2, y: br.y, text: '+' + gain, t: 1, color: br.color });
    spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, 14);
    maybeDropPowerup(br);
    bricks.splice(i, 1);
    beep(500 + Math.min(combo, 14) * 45, 0.06, 'square', 0.07, 140);
    if (!bricks.length) nextLevel();
  } else {
    spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, 5);
    beep(280, 0.04, 'square', 0.05);
  }
}

// ---------- draw ----------
function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85; if (shake < 0.5) shake = 0;
  }
  ctx.fillStyle = '#0b0e1a'; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = 'rgba(112,161,255,0.07)'; ctx.lineWidth = 1;
  for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // bricks
  for (const br of bricks) {
    ctx.globalAlpha = br.hp < br.maxhp ? 0.55 : 1;
    ctx.shadowColor = br.color; ctx.shadowBlur = 10;
    ctx.fillStyle = br.color;
    rr(br.x, br.y, br.w, br.h, 5); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (br.hp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 11px Consolas, monospace'; ctx.textAlign = 'center';
      ctx.fillText(String(br.hp), br.x + br.w / 2, br.y + br.h / 2 + 4);
    }
  }

  // powerups
  for (const p of powerups) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(p.spin) * 0.3);
    ctx.shadowColor = p.color; ctx.shadowBlur = 14;
    ctx.fillStyle = p.color;
    rr(-p.r, -p.r, p.r * 2, p.r * 2, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0b0e1a';
    ctx.font = 'bold 14px Consolas, monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.label, 0, 5);
    ctx.restore();
  }

  // paddle
  const g = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  g.addColorStop(0, '#70a1ff'); g.addColorStop(1, '#a29bfe');
  ctx.shadowColor = '#70a1ff'; ctx.shadowBlur = 16;
  ctx.fillStyle = g;
  rr(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // balls with glow trail
  for (const b of balls) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], f = (i + 1) / b.trail.length;
      ctx.globalAlpha = 0.04 + 0.14 * f;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r * f, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.t * 2, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating score text
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.t, 0, 1);
    ctx.fillStyle = f.color;
    ctx.font = f.big ? 'bold 34px Consolas, monospace' : 'bold 15px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Consolas, monospace';
  ctx.textAlign = 'left'; ctx.fillText('SCORE ' + score, 16, 30);
  ctx.textAlign = 'right'; ctx.fillText('BEST ' + Math.max(best, score), W - 16, 30);
  ctx.textAlign = 'center'; ctx.fillText('LEVEL ' + level, W / 2, 30);
  ctx.textAlign = 'left'; ctx.font = '17px monospace'; ctx.fillStyle = '#ff5d73';
  ctx.fillText('\u2665'.repeat(Math.max(0, lives)), 16, 54);
  if (combo > 1) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#f9f871';
    ctx.font = 'bold 15px Consolas, monospace';
    ctx.fillText('COMBO x' + combo, W / 2, 54);
  }

  drawOverlay();
  ctx.restore();
}

function drawOverlay() {
  if (state === PLAY) return;
  ctx.fillStyle = 'rgba(11,14,26,0.8)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (state === MENU) {
    ctx.shadowColor = '#70a1ff'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 46px Consolas, monospace';
    ctx.fillText('NEON BREAKER', W / 2, H / 2 - 90);
    ctx.shadowBlur = 0;
    ctx.font = '17px Consolas, monospace'; ctx.fillStyle = '#aab4ff';
    ctx.fillText('Move: Mouse  or  Arrow Keys  /  A  D', W / 2, H / 2 - 30);
    ctx.fillText('Launch: Click or Space', W / 2, H / 2);
    ctx.fillText('Power-ups:  W paddle   M multiball   S slow   + life', W / 2, H / 2 + 34);
    ctx.fillText('Marked bricks take 2 hits. Combos multiply your score!', W / 2, H / 2 + 64);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Consolas, monospace';
    ctx.fillText('- Click or press SPACE to start -', W / 2, H / 2 + 120);
  } else {
    ctx.shadowColor = '#ff5d73'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#ff5d73'; ctx.font = 'bold 46px Consolas, monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Consolas, monospace';
    ctx.fillText('Score ' + score + '    Best ' + best, W / 2, H / 2);
    ctx.font = '17px Consolas, monospace'; ctx.fillStyle = '#aab4ff';
    ctx.fillText('Reached level ' + level, W / 2, H / 2 + 34);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Consolas, monospace';
    ctx.fillText('- Click or press R to restart -', W / 2, H / 2 + 90);
  }
}

// ---------- input ----------
function primary() {
  if (state !== PLAY) { resetGame(); return; }
  for (const b of balls) if (b.stuck) launchBall(b);
}

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); primary(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  if ((e.key === 'r' || e.key === 'R') && state !== PLAY) resetGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
});
cvs.addEventListener('mousedown', primary);
cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = cvs.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
  primary();
}, { passive: false });
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = cvs.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
}, { passive: false });

// ---------- main loop ----------
buildLevel();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
