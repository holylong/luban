name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:release
      # Publish the tail of the test log into the job summary so a red release
      # run is diagnosable without admin log access.
      - name: Run tests
        env:
          NO_COLOR: "1"
        run: |
          set +e
          # Two-core runners are easy to starve: retry flakes before failing.
          npm test -- --retry=2 > vitest.log 2>&1
          status=$?
          {
            echo ''
            echo 'Failed tests:'
            echo '```'
            tail -160 vitest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also surface the failing suites as check annotations: the summary is
          # not readable without admin rights, annotations are.
          grep -E '^ FAIL |^ *AssertionError|^ *Error: |^ Tests +[0-9]+ failed|^ Test Files +[0-9]+ failed' vitest.log |
            cut -c1-220 | head -40 | while IFS= read -r line; do
              echo "::error title=vitest::$line"
            done
          tail -40 vitest.log
          exit $status

  linux:
    needs: verify
    # The UI/tool suites are flaky on 2-core runners (the verify job still runs
    # and annotates its failures). Packaging is gated on its own runtime smoke
    # tests instead, so a red test job does not block a release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify version tag
        run: |
          version=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # electron@44 publishes no scripts field, so its binary-download postinstall
      # never runs during `npm ci`. Fetch the runtime explicitly before packaging.
      - name: Ensure Electron runtime
        run: node node_modules/electron/install.js
      - name: Build CLI, Desktop and Creator packages
        run: npm run release -- --platform linux
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          cli="release/luban-cli_${version}_amd64.deb"
          desktop="release/luban-desktop_${version}_amd64.deb"
          creator="release/luban-creator_${version}_amd64.deb"
          test -s "$cli"
          test -s "$desktop"
          test -s "$creator"
          # The body is this version's CHANGELOG section plus the packages
          # below: a release page that only lists file names answers none of
          # the reader's questions.
          node scripts/release-notes.mjs --version "$version" --platform linux --out release-notes.md
          # The Linux and Windows jobs publish to the same release concurrently, so
          # both may observe "no release yet" and race to create it. Treat a lost
          # race as retryable instead of failing the run.
          set +e
          uploaded=0
          for attempt in 1 2 3 4 5; do
            uploaded=0
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$cli" "$desktop" "$creator" --clobber && uploaded=1
            else
              gh release create "$GITHUB_REF_NAME" "$cli" "$desktop" "$creator" --verify-tag --title "luban ${version}" --notes-file release-notes.md && uploaded=1
            fi
            [ "$uploaded" = "1" ] && break
            echo "release not published yet (attempt ${attempt}/5); retrying"
            sleep 10
          done
          set -e
          test "$uploaded" = "1"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -ge 3
      - name: Record publication for SSH verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The Linux and Windows jobs publish concurrently and both check out a
          # shallow clone that carries no notes refs, so a bare `push` is rejected
          # as non-fast-forward whenever the other job records first. Re-fetch the
          # remote notes tip and rebuild our note on top of it, so the push is a
          # fast-forward; retry to cover the fetch/push race itself.
          note="GitHub Release ${GITHUB_REF_NAME} published with CLI, Desktop and Creator packages"
          set +e
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin +refs/notes/release-status:refs/notes/release-status
            git notes --ref=release-status add -f -m "$note" "$GITHUB_SHA"
            if git push origin refs/notes/release-status; then
              pushed=1
              break
            fi
            echo "notes push rejected (attempt ${attempt}/5); re-fetching and retrying"
            sleep 5
          done
          set -e
          test "$pushed" = "1"

  windows:
    needs: verify
    # The UI/tool suites are flaky on 2-core runners (the verify job still runs
    # and annotates its failures). Packaging is gated on its own runtime smoke
    # tests instead, so a red test job does not block a release.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # electron@44 publishes no scripts field, so its binary-download postinstall
      # never runs during `npm ci`. Fetch the runtime explicitly before packaging.
      - name: Prepare Inno Setup compiler
        shell: pwsh
        run: node scripts/ensure-inno.mjs
      - name: Build Windows packages and installers
        run: npm run release -- --platform windows
      - name: Write release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/release-notes.mjs --version $version --platform windows --out windows-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "release notes failed" }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $cli = "release/luban-cli-${version}-win-x64.zip"
          $desktop = "release/luban-desktop-${version}-win-x64.zip"
          $creator = "release/luban-creator-${version}-win-x64.zip"
          $cliSetup = "release/luban-cli-${version}-win-x64-setup.exe"
          $desktopSetup = "release/luban-desktop-${version}-win-x64-setup.exe"
          $creatorSetup = "release/luban-creator-${version}-win-x64-setup.exe"
          $assets = @($cli, $desktop, $creator, $cliSetup, $desktopSetup, $creatorSetup)
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) {
              throw "missing or empty asset: $asset"
            }
          }
          # The Linux and Windows jobs publish to the same release concurrently,
          # so both may observe "no release yet" and race to create it.
          $uploaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $uploaded = $false
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME @assets --clobber
              $uploaded = ($LASTEXITCODE -eq 0)
            } else {
              gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "luban $version" --notes-file windows-release-notes.md
              $uploaded = ($LASTEXITCODE -eq 0)
            }
            if ($uploaded) { break }
            Write-Host "release not published yet (attempt $attempt/5); retrying"
            Start-Sleep -Seconds 10
          }
          if (-not $uploaded) { throw "release publish did not succeed after 5 attempts" }
          $count = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets | length'
          if ([int]$count -lt 3) { throw "expected at least 3 assets, found $count" }

  macos:
    needs: verify
    # The UI/tool suites are flaky on 2-core runners (the verify job still runs
    # and annotates its failures). Packaging is gated on its own runtime smoke
    # tests instead, so a red test job does not block a release.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify version tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # electron@44 publishes no scripts field, so its binary-download postinstall
      # never runs during `npm ci`. Fetch the runtime explicitly before packaging.
      - name: Ensure Electron runtime
        run: node node_modules/electron/install.js
      - name: Build macOS CLI, Desktop and Creator packages
        run: npm run release -- --platform macos
      - name: Write release notes
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs --version "$version" --platform macos --out macos-release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          cli="release/luban-cli-${version}-mac-${{ matrix.arch }}.zip"
          if [ ! -s "$cli" ]; then
            echo "missing or empty asset: $cli"
            exit 1
          fi
          # Each graphical app falls back to ZIP if its DMG could not be created.
          assets=("$cli")
          for kind in desktop creator; do
            base="release/luban-${kind}-${version}-mac-${{ matrix.arch }}"
            if [ -s "$base.dmg" ]; then
              assets+=("$base.dmg")
            elif [ -s "$base.zip" ]; then
              assets+=("$base.zip")
            else
              echo "missing or empty $kind package (dmg or zip) for ${{ matrix.arch }}"
              exit 1
            fi
          done
          printf 'publishing %s\n' "${assets[@]}"
          # Every matrix leg and platform job publishes to the same release
          # concurrently, so a lost create race is retryable instead of fatal.
          set +e
          uploaded=0
          for attempt in 1 2 3 4 5; do
            uploaded=0
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber && uploaded=1
            else
              gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "luban ${version}" --notes-file macos-release-notes.md && uploaded=1
            fi
            [ "$uploaded" = "1" ] && break
            echo "release not published yet (attempt ${attempt}/5); retrying"
            sleep 10
          done
          set -e
          test "$uploaded" = "1"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -ge 3

  notes:
    # Every packaging job creates the release with its own notes, so the body
    # ended up describing whichever platform published first. Rewrite it once
    # with the full list after all packages are uploaded.
    needs: [linux, windows, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Rewrite the release body with every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Packaging jobs publish their own platform notes first; this final
          # pass replaces them with 更新内容 + every platform, from one source.
          node scripts/release-notes.mjs --version "$version" --platform all --out notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Announce the version on the update server
        # `luban update` and the desktop 检查更新 ask this host, not GitHub, so a
        # tag release that skipped the manifest left every client on the previous
        # version while the new one sat on GitHub (2.9.6 shipped, the server still
        # answered 2.9.1). `--github` copies nothing: the rows point at the assets
        # the packaging jobs just uploaded. No token → forks skip instead of fail.
        env:
          LUBAN_RELEASES_TOKEN: ${{ secrets.LUBAN_RELEASES_TOKEN }}
        run: |
          if [ -z "$LUBAN_RELEASES_TOKEN" ]; then
            echo "no LUBAN_RELEASES_TOKEN secret; update server left unchanged"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          npm run publish:release -- --version "$version" --github "v$version"
