plugins { id 'com.android.application' }

android {
    namespace 'dev.luban.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.luban.remote'
        minSdk 26
        targetSdk 35
        versionCode 11607
        versionName '1.16.7'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
