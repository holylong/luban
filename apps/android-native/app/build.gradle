plugins { id 'com.android.application' }

android {
    namespace 'dev.luban.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.luban.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
