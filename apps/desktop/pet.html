<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self';"><title>luban 桌宠</title><link rel="stylesheet" href="pet.css"></head><body><main id="pet"><header><span>luban · 拖动这里移动</span><button id="hide" class="pet-hide" type="button" title="隐藏悬浮窗（可从主界面按钮或托盘菜单恢复）" aria-label="隐藏悬浮窗">×</button></header><button id="face" title="点我打开主界面" aria-label="打开主界面">🤖<span id="mouth">喂我一个任务</span></button><button id="soul" type="button" title="造物主状态；点一下看任务、子 agent、进程与授权申请">● 造物主 · 未启动</button><section id="bubble" role="status">拖文字或文本文件给我，吃进去，吐结果。</section><section id="queue" aria-live="polite"></section><div id="files"></div><textarea id="task" maxlength="8000" placeholder="告诉我做什么，或把文件拖到我身上…"></textarea><small>文件内容会发送给当前模型；最多4个 UTF-8 文本文件，每个128KB。</small><div class="actions"><button id="feed">喂给 luban</button><button id="clear">清空附件</button><button id="open">主界面 / 审批</button></div></main><script src="pet.js"></script></body></html>
